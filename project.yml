name: Inkling
options:
  bundleIdPrefix: com.jackwallner
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: "2.38"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0
schemes:
  Inkling:
    build:
      targets:
        Inkling: all
        InklingTests: [test]
        InklingUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Inkling.storekit
    test:
      config: Debug
      targets:
        - InklingTests
        - InklingUITests
targets:
  Inkling:
    type: application
    platform: iOS
    sources:
      - path: Inkling
        excludes:
          - Art
      - path: Inkling/Art
        type: folder
        buildPhase: resources
      - path: Shared
      - path: Inkling.storekit
        buildPhase: none
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.writing
        INFOPLIST_FILE: Inkling/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  InklingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InklingTests
    dependencies:
      - target: Inkling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.writing.tests
        GENERATE_INFOPLIST_FILE: YES
  InklingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: InklingUITests
    dependencies:
      - target: Inkling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.writing.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Inkling
